name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: qa
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create .env file
      run: |
        echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
        echo "SAUCE_USERNAME=${{ secrets.SAUCE_USERNAME }}" >> .env
        echo "SAUCE_PASSWORD=${{ secrets.SAUCE_PASSWORD }}" >> .env
        echo "LOCKED_OUT_USER=${{ secrets.LOCKED_OUT_USER }}" >> .env

    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    - name: Generate Allure Environment info
      if: always()
      run: |
        mkdir -p allure-results
        echo "Environment=QA" >> allure-results/environment.properties
        echo "URL=${{ secrets.BASE_URL }}" >> allure-results/environment.properties
        echo "Browser=Chromium" >> allure-results/environment.properties
        echo "Reporters=Allure, HTML" >> allure-results/environment.properties

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Allure Report action from marketplace
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy report to Github Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
